name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m nextfft_lab.bench --max-power 7 --repeats 2

  research-z3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,research]'
      - name: Confirm Z3 is importable
        run: python -c "import z3; print(z3.get_version_string())"
      - name: Run full suite with Z3
        run: python -m pytest -q -rs --junitxml=research-results.xml
      - name: Require a passing Z3 regression
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          cases = [
              case for case in ET.parse("research-results.xml").iter("testcase")
              if case.get("classname", "").endswith("test_record_search")
              and case.get("name") == "test_fixed_dag_scale_unsat_at_19"
          ]
          if len(cases) != 1 or any(
              cases[0].find(result) is not None for result in ("skipped", "failure", "error")
          ):
              raise SystemExit("The Z3 regression must run and pass in research CI.")
          print("The Z3 regression ran and passed.")
          PY
